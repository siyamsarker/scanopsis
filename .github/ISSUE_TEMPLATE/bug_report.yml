name: Bug report
description: Report a defect in Scanopsis.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem you observed.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: Describe what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem, in order.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: scanopsis-version
    attributes:
      label: Scanopsis version
      description: The version (for example v1.0.0, from /api/v1/version) or the commit you are running.
      placeholder: e.g. v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: gitlab-version
    attributes:
      label: GitLab version
      description: The version of the GitLab instance that produced the CI/CD pipelines, if relevant.
    validations:
      required: false
  - type: input
    id: sonarqube-version
    attributes:
      label: SonarQube edition and version
      description: The SonarQube edition (for example Community Build, or Developer or Enterprise edition of SonarQube Server) and version, if relevant.
    validations:
      required: false
  - type: input
    id: trivy-version
    attributes:
      label: Trivy version
      description: The version of Trivy, if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste any relevant log output. Remove tokens, passwords, API keys and other secrets before you post.
      render: shell
    validations:
      required: false
