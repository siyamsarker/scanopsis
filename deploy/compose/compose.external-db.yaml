# Override for an existing PostgreSQL server. It removes the bundled `db`
# service and its password secret. Scanopsis keeps its ./backups mount. Use it
# together with compose.yaml, for example with this line in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.external-db.yaml
#
# It needs Docker Compose 2.24.4 or later, the first version that reads the
# !override tag below.
#
# Put the connection URL of your server in ./secrets/database_url, see
# docs/deployment.md ("Use an existing PostgreSQL"). Scanopsis reaches the
# server through the `frontend` network, which has a route to the outside.

services:
  db: !reset null
  scanopsis:
    depends_on: !reset null
    networks: !override
      - frontend
    # Only if the server presents a certificate from your own certificate
    # authority: put the CA in ./db-ca.pem, uncomment the next two lines, and
    # end the URL in ./secrets/database_url with
    # sslmode=verify-full&sslrootcert=/etc/scanopsis/db-ca.pem
    # volumes:
    #   - ./db-ca.pem:/etc/scanopsis/db-ca.pem:ro

secrets:
  postgres_password: !reset null
