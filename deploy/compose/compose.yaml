# Scanopsis and its PostgreSQL database.
#
# Run all commands in this directory. The guide is docs/getting-started.md.
#
# Image: Scanopsis publishes no container image. Build one from the newest
# version branch, release/0.4.1, with `make image IMAGE=scanopsis:v0.4.1` in
# the repository root (docs/versions.md). The file named .env next to this
# one sets SCANOPSIS_IMAGE=scanopsis:v0.4.1, as .env.example does.
# SCANOPSIS_IMAGE is required, so Compose never falls back to an unpinned
# image.
#
# Data: the database lives in ./data/postgres and the backups in ./backups,
# plain folders next to this file. No Docker cleanup command (`docker compose down -v`,
# `docker volume prune`, `docker system prune`) deletes a folder.
# Create both before the first start (see docs/getting-started.md).
# ./data/postgres must belong to user 70 (the user the PostgreSQL image runs
# as) and ./backups to user 65532 (the user Scanopsis runs as).
#
# TLS: the port is published on the loopback interface only (set
# SCANOPSIS_BIND and SCANOPSIS_PORT in .env to change that). Put a reverse
# proxy in front of it that terminates TLS (see docs/deployment.md).
#
# Secrets: create the three files under ./secrets before `docker compose up`
# (see docs/getting-started.md). They are mounted read-only under
# /run/secrets, so their values do not appear in `docker inspect` or the
# environment. Keep secrets out of .env: enter the GitLab client secret on the
# Settings page, where it is stored encrypted.

name: scanopsis

# Rotate container logs, so that they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanopsis
      POSTGRES_DB: scanopsis
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # A host folder, not a named volume, so that no Docker cleanup command
      # deletes the data. Create it with mode 700 for user 70, the user the
      # PostgreSQL image runs as (only it may open the database files). PostgreSQL 18 keeps its
      # files in a versioned subfolder (18/docker) below this path.
      - ./data/postgres:/var/lib/postgresql
    # Only Scanopsis can reach the database; it has no route to other networks.
    networks:
      - backend
    # The entrypoint needs these capabilities to prepare the data directory
    # and switch to the postgres user; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *logging
    pids_limit: 200
    # PostgreSQL gets two minutes to stop cleanly (checkpoint and close the
    # files) before Compose kills it. The default of 10 seconds is too short
    # for a busy database.
    stop_grace_period: 2m
    # The default shared memory of a container is 64 MB, which parallel
    # queries and large sorts can exhaust.
    shm_size: 256mb
    # The data directory is the only place the database writes to, apart from
    # its socket directory and temporary files.
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanopsis -d scanopsis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  scanopsis:
    image: ${SCANOPSIS_IMAGE:?set SCANOPSIS_IMAGE in .env, see the comment at the top of this file}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The image declares its own health check (`/scanopsis healthcheck`).
    # Do not redefine it here.
    env_file:
      - .env
    environment:
      SCANOPSIS_DATABASE_URL_FILE: /run/secrets/database_url
      SCANOPSIS_SECRET_KEY_FILE: /run/secrets/secret_key
      # Make the Go garbage collector work before the container limit
      # (mem_limit below) is reached. Keep it about 20% under mem_limit.
      GOMEMLIMIT: 400MiB
    secrets:
      - database_url
      - secret_key
    volumes:
      # Backups are written here. The folder belongs to user 65532, which
      # runs Scanopsis, with mode 700 (see docs/getting-started.md).
      - ./backups:/var/lib/scanopsis/backups
    networks:
      - backend
      - frontend
    ports:
      - "${SCANOPSIS_BIND:-127.0.0.1}:${SCANOPSIS_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The application finishes running requests within 15 seconds when it is
    # stopped, and a running backup needs time to finish its file. Compose
    # kills it after 30 seconds.
    stop_grace_period: 30s
    logging: *logging
    pids_limit: 100
    # A limit for the container. Raise it if the container is killed for
    # lack of memory (docker inspect shows OOMKilled).
    mem_limit: 512m

secrets:
  database_url:
    file: ./secrets/database_url
  secret_key:
    file: ./secrets/secret_key
  postgres_password:
    file: ./secrets/postgres_password

networks:
  # Published port and outgoing connections (GitLab).
  frontend:
  backend:
    internal: true
