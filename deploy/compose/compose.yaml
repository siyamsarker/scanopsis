# Scanopsis and its PostgreSQL database.
#
# Run all commands in this directory. The guide is docs/getting-started.md.
#
# Image: Scanopsis publishes no container image. Build one from a version
# branch with `make image` in the repository root (docs/versions.md), then set
# SCANOPSIS_IMAGE=scanopsis:dev in the file named .env next to this one
# (.env.example already does). SCANOPSIS_IMAGE is required, so Compose never
# falls back to an unpinned image.
#
# TLS: the port is published on the loopback interface only (set
# SCANOPSIS_BIND and SCANOPSIS_PORT in .env to change that). Put a reverse
# proxy in front of it that terminates TLS (see docs/deployment.md).
#
# Secrets: create the three files under ./secrets before `docker compose up`
# (see docs/getting-started.md). They are mounted read-only under
# /run/secrets, so their values do not appear in `docker inspect` or the
# environment. Keep secrets out of .env: enter the GitLab client secret on the
# Settings page, where it is stored encrypted.

name: scanopsis

# Rotate container logs, so that they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanopsis
      POSTGRES_DB: scanopsis
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db-data:/var/lib/postgresql
    # Only Scanopsis can reach the database; it has no route to other networks.
    networks:
      - backend
    # The entrypoint needs these capabilities to prepare the data directory
    # and switch to the postgres user; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *logging
    pids_limit: 200
    # The data directory is the only place the database writes to, apart from
    # its socket directory and temporary files.
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanopsis -d scanopsis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  scanopsis:
    image: ${SCANOPSIS_IMAGE:?set SCANOPSIS_IMAGE in .env, see the comment at the top of this file}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The image declares its own health check (`/scanopsis healthcheck`).
    # Do not redefine it here.
    env_file:
      - .env
    environment:
      SCANOPSIS_DATABASE_URL_FILE: /run/secrets/database_url
      SCANOPSIS_SECRET_KEY_FILE: /run/secrets/secret_key
      # Make the Go garbage collector work before the container limit
      # (mem_limit below) is reached. Keep it about 20% under mem_limit.
      GOMEMLIMIT: 400MiB
    secrets:
      - database_url
      - secret_key
    networks:
      - backend
      - frontend
    ports:
      - "${SCANOPSIS_BIND:-127.0.0.1}:${SCANOPSIS_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The application finishes running requests within 15 seconds when it is
    # stopped. Compose kills it after 20 seconds.
    stop_grace_period: 20s
    logging: *logging
    pids_limit: 100
    # A limit for the container. Raise it if the container is killed for
    # lack of memory (docker inspect shows OOMKilled).
    mem_limit: 512m

secrets:
  database_url:
    file: ./secrets/database_url
  secret_key:
    file: ./secrets/secret_key
  postgres_password:
    file: ./secrets/postgres_password

networks:
  # Published port and outgoing connections (GitLab).
  frontend:
  backend:
    internal: true

volumes:
  db-data:
