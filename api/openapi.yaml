openapi: 3.1.0
info:
  title: Scanopsis API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    JSON API of Scanopsis. Every endpoint under /api/v1 except the
    authentication endpoints requires a session cookie. State-changing
    requests from browsers must be same-origin (checked with the
    Sec-Fetch-Site and Origin headers).
servers:
  - url: /
tags:
  - name: ops
  - name: auth
  - name: users
  - name: setup
  - name: settings

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe. Does not check dependencies.
      operationId: healthz
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe. Checks the database connection.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready. The reason names the failing dependency without secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /api/v1/version:
    get:
      tags: [ops]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /api/v1/auth/methods:
    get:
      tags: [auth]
      summary: Sign-in methods enabled on this server.
      operationId: getAuthMethods
      security: []
      responses:
        "200":
          description: Enabled methods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethods" }

  /api/v1/auth/gitlab/login:
    get:
      tags: [auth]
      summary: Start GitLab sign-in.
      description: |
        Redirects the browser to GitLab (authorization code flow with PKCE,
        state and nonce). return_to must be a local path starting with a
        single "/"; anything else is replaced by "/".
      operationId: gitlabLogin
      security: []
      parameters:
        - name: return_to
          in: query
          schema: { type: string, example: /services }
      responses:
        "302": { description: Redirect to the GitLab authorization endpoint. }
        "404": { description: GitLab sign-in is not configured., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: GitLab could not be reached., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/gitlab/callback:
    get:
      tags: [auth]
      summary: GitLab redirect target. Completes sign-in.
      description: |
        On success, sets the session cookie and redirects to return_to. On
        failure, redirects to /login?error=<code> where code is one of
        access_denied, group_not_allowed, login_expired, login_failed.
      operationId: gitlabCallback
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the application or to the sign-in page with an error code. }

  /api/v1/auth/local/login:
    post:
      tags: [auth]
      summary: Sign in as the local administrator.
      operationId: localLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalLoginRequest" }
      responses:
        "204": { description: Signed in. The session cookie is set. }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Wrong username or password., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Local sign-in is disabled., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts from this network or for this username. Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: The server is busy hashing other passwords and the request ended while waiting. Try again., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Signed out. The session is deleted and the cookie cleared. }

  /api/v1/me:
    get:
      tags: [auth]
      summary: The signed-in user and the state of the session.
      description: |
        Also answers for a session that still has to complete two-factor
        authentication or a password change, so the web interface can guide
        the user. Every other endpoint that needs a session answers 403 with
        code mfa_required, mfa_enrollment_required or password_change_required
        until the session is complete.
      operationId: getMe
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users:
    get:
      tags: [users]
      summary: List users (admin only), ordered by id.
      operationId: listUsers
      parameters:
        - name: after
          in: query
          description: Return users with an id greater than this value.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}:
    patch:
      tags: [users]
      summary: Change a user's role (admin only).
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid request body., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such user., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The change would leave no administrator (code last_admin)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/setup:
    get:
      tags: [setup]
      summary: Whether the first-run setup is still required (no administrator exists).
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      tags: [setup]
      summary: Create the first administrator (local account) with the one-time setup token.
      description: |
        The token is printed to the server log at start while no administrator
        exists. On success the session cookie is set; the new administrator must
        enrol two-factor authentication before the session is fully usable.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Administrator created and signed in (two-factor enrolment pending). }
        "400": { description: Invalid request or password does not meet the rules (code invalid_request or weak_password)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Wrong setup token (code invalid_setup_token)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Setup is already complete (code setup_complete)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts. Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: Complete sign-in with a TOTP code or a recovery code.
      description: Allowed for a session that has passed the first factor and whose user has enrolled.
      operationId: verifyMFA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACode" }
      responses:
        "204": { description: Second factor accepted; the session is fully usable. }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Wrong or reused code (code invalid_code), or no session., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Two-factor authentication is not enrolled yet (code mfa_enrollment_required)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts. Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/mfa/enrollment:
    post:
      tags: [auth]
      summary: Start TOTP enrolment and get the secret to add to an authenticator app.
      description: |
        Allowed for a session whose user has not enrolled (first sign-in or
        after a reset). Calling it again replaces the pending secret.
      operationId: startMFAEnrollment
      responses:
        "200":
          description: Pending enrolment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: Already enrolled (code mfa_already_enrolled)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      tags: [auth]
      summary: Confirm enrolment with a code from the app and receive recovery codes.
      operationId: confirmMFAEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACode" }
      responses:
        "200":
          description: Enrolled. The recovery codes are shown only this once; the session is fully usable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Wrong code (code invalid_code), or no session., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: No pending enrolment (code mfa_enrollment_not_started) or already enrolled., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/me/password:
    post:
      tags: [auth]
      summary: Change the password of the signed-in local user.
      description: |
        Required after a password reset from the command line. Allowed for a
        session whose second factor is verified. Other sessions of the user are
        signed out.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        "400": { description: Invalid request or weak password (code weak_password)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Wrong current password (code invalid_credentials), or no session., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not a local account (code not_local) or second factor not verified., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/users/{id}/mfa:
    delete:
      tags: [users]
      summary: Reset a user's two-factor authentication (admin only).
      description: Removes the TOTP secret and recovery codes and signs the user out everywhere; the user enrols again at the next sign-in.
      operationId: resetUserMFA
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Reset. }
        "400": { description: Invalid id., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such user., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/settings:
    get:
      tags: [settings]
      summary: List all runtime settings (admin only). Secret values are never returned.
      operationId: listSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [settings]
      summary: Change runtime settings (admin only). Changes apply immediately.
      description: |
        The body maps setting keys to new values. A null value resets the key to
        its environment or default value. All changes are validated together and
        applied atomically.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingUpdate" }
      responses:
        "200":
          description: Settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        "400":
          description: Validation failed (code invalid_settings); details name each key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-scanopsis_session
      description: Named scanopsis_session when the public URL uses plain HTTP.
  responses:
    Unauthenticated:
      description: No valid session.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The signed-in user lacks the required role.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable machine-readable code., example: unauthenticated }
            message: { type: string, description: Human-readable explanation and next step. }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
        reason: { type: string }
    Version:
      type: object
      required: [version, commit, go]
      properties:
        version: { type: string }
        commit: { type: string }
        go: { type: string }
    AuthMethods:
      type: object
      required: [gitlab, local]
      properties:
        gitlab: { type: boolean }
        local: { type: boolean }
    LocalLoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    User:
      type: object
      required: [id, source, username, name, email, role, created_at, last_login_at]
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [gitlab, local] }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
    UserPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_after:
          type: [integer, "null"]
          format: int64
          description: Pass as `after` to get the next page; null on the last page.
    UserUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }
    Role:
      type: string
      enum: [admin, viewer]
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [mfa_enrolled, mfa_verified, must_change_password]
          properties:
            mfa_enrolled: { type: boolean, description: The user has a confirmed TOTP enrolment. }
            mfa_verified: { type: boolean, description: This session has passed the second factor. }
            must_change_password: { type: boolean }
    SetupStatus:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
    SetupRequest:
      type: object
      required: [token, username, password]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 200 }
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    MFACode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 64, description: "A 6-digit TOTP code or a recovery code (xxxxx-xxxxx)." }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        otpauth_uri: { type: string, description: otpauth://totp/... URI for a QR code. }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 12, maxLength: 1024 }
    Setting:
      type: object
      required: [key, type, secret, source, value, is_set, env_var, description]
      properties:
        key: { type: string, example: gitlab.allowed_groups }
        type: { type: string, enum: [string, url, boolean, duration, string_list] }
        secret: { type: boolean }
        source: { type: string, enum: [default, env, ui] }
        value:
          description: Current value; always null for secrets.
          oneOf:
            - { type: "null" }
            - { type: string }
            - { type: boolean }
            - { type: array, items: { type: string } }
        is_set: { type: boolean, description: For secrets, whether a value exists. }
        env_var: { type: string, description: Environment variable that seeds this setting. }
        description: { type: string }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    SettingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Setting" }
    SettingUpdate:
      type: object
      additionalProperties:
        oneOf:
          - { type: "null" }
          - { type: string }
          - { type: boolean }
          - { type: array, items: { type: string } }
    SettingsError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: { type: string, example: invalid_settings }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Problem per setting key.
security:
  - session: []
