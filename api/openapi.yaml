openapi: 3.1.0
info:
  title: Scanopsis API
  version: 0.4.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    JSON API of Scanopsis. Most endpoints require a signed-in session
    (a session cookie); each endpoint states how it is authenticated: a
    session, an administrator session, a GitLab CI/CD ID token (the Trivy
    upload), a signed webhook (SonarQube) or none (setup, version, health).
    State-changing requests from browsers must be same-origin (checked with
    the Sec-Fetch-Site and Origin headers).

    The server serves a limited number of API requests at a time, as many
    as it has database connections. When all are busy a request waits a few
    seconds and is then answered `503` with the code `busy` and a
    `Retry-After` header (seconds). Nothing was done: retry the request.
    One client address may hold at most a quarter of the slots, so one client
    cannot use them all.
    The probes, the web interface, the Trivy upload, the backup download and
    the parts of backup uploads are not counted. The parts of backup uploads
    have a limit of their own: at most 4 at once, 2 from one client address.

    While a backup is being restored, every API request except
    GET /api/v1/version and GET /api/v1/restore/status is answered `503`
    with the code `restoring` and `Retry-After: 30`. The probes and the web
    interface keep working.
servers:
  - url: /
tags:
  - name: ops
  - name: auth
  - name: users
  - name: setup
  - name: settings
  - name: ingest
  - name: sonarqube
  - name: services
  - name: scans
  - name: findings
  - name: admin
  - name: backups

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe. Does not check dependencies.
      operationId: healthz
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe. Checks the database over a connection of its own, so it answers while requests are waiting for the pool.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready. The reason names the failing dependency without secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /api/v1/version:
    get:
      tags: [ops]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/methods:
    get:
      tags: [auth]
      summary: Sign-in methods enabled on this server.
      operationId: getAuthMethods
      security: []
      responses:
        "200":
          description: Enabled methods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethods" }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/gitlab/login:
    get:
      tags: [auth]
      summary: Start GitLab sign-in.
      description: |
        Redirects the browser to GitLab (authorization code flow with PKCE,
        state and nonce). return_to must be a local path. It is cleaned
        (dot segments and repeated slashes resolved) and then checked: a
        backslash or a control character anywhere, raw or percent-encoded,
        or a result that does not start with exactly one "/" is replaced by
        "/". Only the path and the query are kept.
      operationId: gitlabLogin
      security: []
      parameters:
        - name: return_to
          in: query
          schema: { type: string, example: /services }
      responses:
        "302": { description: Redirect to the GitLab authorization endpoint. }
        "404": { description: GitLab sign-in is not configured., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "GitLab could not be reached, or the server is busy (code busy; Retry-After gives seconds).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/gitlab/callback:
    get:
      tags: [auth]
      summary: GitLab redirect target. Completes sign-in.
      description: |
        On success, sets the session cookie and redirects to return_to. On
        failure, redirects to /login?error=<code> where code is one of
        access_denied, account_disabled, group_not_allowed, login_expired,
        login_failed.
      operationId: gitlabCallback
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the application or to the sign-in page with an error code. }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/local/login:
    post:
      tags: [auth]
      summary: Sign in as the local administrator.
      operationId: localLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalLoginRequest" }
      responses:
        "204": { description: Signed in. The session cookie is set. }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Wrong username or password., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "The password is right, but an administrator disabled the account (code account_disabled).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Local sign-in is disabled., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts from this network or for this username. Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "The server is busy: no slot became free within a few seconds (code busy; Retry-After gives seconds), or it is busy hashing other passwords and the request ended while waiting. Try again.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Signed out. The session is deleted and the cookie cleared. }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/me:
    get:
      tags: [auth]
      summary: The signed-in user and the state of the session.
      description: |
        Also answers for a session that still has to complete two-factor
        authentication or a password change, so the web interface can guide
        the user. Every other endpoint that needs a session answers 403 with
        code mfa_required, mfa_enrollment_required or password_change_required
        until the session is complete.
      operationId: getMe
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/users:
    get:
      tags: [users]
      summary: List users (admin only), ordered by id.
      operationId: listUsers
      parameters:
        - name: after
          in: query
          description: Return users with an id greater than this value.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/users/{id}:
    patch:
      tags: [users]
      summary: Change a user's role, or disable or enable the user (admin only).
      description: |
        Disabling refuses every sign-in of the user (local and GitLab) and
        ends all of the user's sessions; enabling restores access. Recorded in
        the audit log as user.role_changed, user.disabled or user.enabled.
        Administrators cannot disable their own account, and the last enabled
        administrator can be neither disabled nor demoted.
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid request body., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such user., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "The change would leave no enabled administrator (code last_admin), or disables the caller's own account (code own_account).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
    delete:
      tags: [users]
      summary: Delete a user (admin only).
      description: |
        Removes the user with their sessions and recovery codes. Audit events
        keep the name they were recorded with. Recorded as user.deleted. A
        GitLab user who signs in again afterwards comes back as a new viewer;
        disable the user instead to keep them out. Administrators cannot
        delete their own account or the last enabled administrator.
      operationId: deleteUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "400": { description: Invalid id., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such user., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "The user is the last enabled administrator (code last_admin), or the caller (code own_account).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/setup:
    get:
      tags: [setup]
      summary: Whether the first-run setup is still required (no administrator exists).
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [setup]
      summary: Create the first administrator (local account) with the one-time setup token.
      description: |
        The token is printed to the server log at start while no administrator
        exists. On success the session cookie is set; the new administrator must
        enrol two-factor authentication before the session is fully usable.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Administrator created and signed in (two-factor enrolment pending). }
        "400": { description: Invalid request or password does not meet the rules (code invalid_request or weak_password)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Wrong setup token (code invalid_setup_token)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Setup is already complete (code setup_complete)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts. Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: Complete sign-in with a TOTP code or a recovery code.
      description: Allowed for a session that has passed the first factor and whose user has enrolled.
      operationId: verifyMFA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACode" }
      responses:
        "204": { description: Second factor accepted; the session is fully usable. }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "Wrong or reused code (code invalid_code), or no session.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Two-factor authentication is not enrolled yet (code mfa_enrollment_required)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: Ten wrong codes in a row locked two-factor sign-in for this user (code mfa_locked). Every code is refused until an administrator resets two-factor authentication or the password; the user's sessions were ended., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts. Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/mfa/enrollment:
    post:
      tags: [auth]
      summary: Start TOTP enrolment and get the secret to add to an authenticator app.
      description: |
        Allowed for a session whose user has not enrolled (first sign-in or
        after a reset). Calling it again replaces the pending secret.
      operationId: startMFAEnrollment
      responses:
        "200":
          description: Pending enrolment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: Already enrolled (code mfa_already_enrolled)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      tags: [auth]
      summary: Confirm enrolment with a code from the app and receive recovery codes.
      operationId: confirmMFAEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACode" }
      responses:
        "200":
          description: Enrolled. The recovery codes are shown only this once; the session is fully usable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "Wrong code (code invalid_code), or no session.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: No pending enrolment (code mfa_enrollment_not_started) or already enrolled., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/me/password:
    post:
      tags: [auth]
      summary: Change the password of the signed-in local user.
      description: |
        Required after a password reset from the command line. Allowed for a
        session whose second factor is verified. Other sessions of the user are
        signed out.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        "400": { description: Invalid request or weak password (code weak_password)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "Wrong current password (code invalid_credentials), or no session.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not a local account (code not_local) or second factor not verified., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/me/sessions:
    get:
      tags: [auth]
      summary: The signed-in user's sessions that are still valid, most recently used first.
      description: |
        Lists at most 200 sessions. The client address and the browser are
        as recorded when the session started; sessions started before they
        were recorded show empty strings.
      operationId: listMySessions
      responses:
        "200":
          description: Sessions of the signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
    delete:
      tags: [auth]
      summary: End every other session of the signed-in user.
      description: The session making the request stays signed in. Recorded in the audit log as session.revoked when at least one session ended.
      operationId: endOtherSessions
      responses:
        "200":
          description: How many sessions ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsEnded" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/me/sessions/{id}:
    delete:
      tags: [auth]
      summary: End one other session of the signed-in user.
      description: Recorded in the audit log as session.revoked. The current session ends with sign-out instead.
      operationId: endMySession
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: The session ended. }
        "400": { description: Invalid id., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The user has no other session with this id., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: This is the current session (code current_session)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/users/{id}/mfa:
    delete:
      tags: [users]
      summary: Reset a user's two-factor authentication (admin only).
      description: Removes the TOTP secret and recovery codes and signs the user out everywhere; the user enrols again at the next sign-in.
      operationId: resetUserMFA
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Reset. }
        "400": { description: Invalid id., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such user., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/settings:
    get:
      tags: [settings]
      summary: List all runtime settings (admin only). Secret values are never returned.
      operationId: listSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
    patch:
      tags: [settings]
      summary: Change runtime settings (admin only). Changes apply immediately.
      description: |
        The body maps setting keys to new values. A null value resets the key to
        its environment or default value. All changes are validated together and
        applied atomically.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingUpdate" }
      responses:
        "200":
          description: Settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        "400":
          description: Validation failed (code invalid_settings); details name each key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/ingest/trivy:
    post:
      tags: [ingest]
      summary: Upload one Trivy JSON report from a GitLab CI job.
      description: |
        Authenticated with the job's GitLab CI/CD ID token (`Authorization:
        Bearer <token>`), whose audience must be the Scanopsis public URL. The
        project, pipeline, job, ref and commit come from the verified token,
        never from the report. The body is the raw report (`Content-Type:
        application/json`), optionally gzip-compressed (`Content-Encoding:
        gzip`). A repeated upload for the same job, artifact and kind replaces
        the earlier one. Rejections are written to the audit log, except requests limited per
        client address (429, code too_many_requests), and at most a bounded number per client
        address for rejections before the namespace and protected-ref checks and for the
        per-project limits. A job stores at most 50 different artifacts (artifact name and
        kind); a project may upload 100 reports at once and then one every 10 seconds. The
        body must arrive within 5 minutes of the upload being accepted.
      operationId: ingestTrivy
      security: [ { ciIdToken: [] } ]
      parameters:
        - name: kind
          in: query
          description: image (default) for `trivy image`, secret-fs for `trivy fs --scanners secret`.
          schema: { type: string, enum: [image, secret-fs], default: image }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Trivy JSON report (SchemaVersion 2). }
      responses:
        "201": { description: Stored., content: { application/json: { schema: { $ref: "#/components/schemas/IngestResult" } } } }
        "400": { description: "Malformed body or gzip stream (code invalid_report), or an unknown kind (code invalid_parameter).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Missing or invalid ID token (code invalid_token; the message names the failed check)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Project namespace not allowed (code namespace_not_allowed) or ref not protected (code ref_not_protected)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "408": { description: "The body did not arrive within the read deadline of 5 minutes (code request_timeout). The connection is closed. Retry the upload.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "The project's service is archived (code service_archived), or its path belongs to another service (code service_conflict).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: Report larger than the limit or with too many findings (code report_too_large)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Unsupported content type or encoding (code unsupported_media_type)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Not a Trivy JSON report, or an unsupported schema version (code not_a_trivy_report).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Too many uploads from this address (code too_many_requests), too many from the project (code project_rate_limited), or the job already stored 50 different artifacts (code job_artifact_limit; its Retry-After is an hour, because waiting does not help that job). Retry-After gives seconds.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "The GitLab URL is not configured (code ingest_not_configured), GitLab's signing keys could not be fetched (code gitlab_unavailable), no memory was free for the upload within 30 seconds or the request ended while waiting (code busy; Retry-After gives seconds), or the database could not be reached (code unavailable; the report was not stored; Retry-After gives seconds).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/hooks/sonarqube:
    post:
      tags: [sonarqube]
      summary: SonarQube webhook target.
      description: |
        Verified with the X-Sonar-Webhook-HMAC-SHA256 header (hex HMAC-SHA256 of
        the raw body with the webhook secret). Deliveries are deduplicated by
        taskId. The analysis is then read from the SonarQube Web API.
      operationId: sonarWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: SonarQube webhook payload. }
      responses:
        "202": { description: Accepted (also for a duplicate delivery). }
        "400": { description: Malformed payload (code invalid_payload)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Missing or wrong signature (code invalid_signature)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: Payload too large., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "SonarQube integration not configured (code sonar_not_configured), or the server is busy (code busy; Retry-After gives seconds).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/portfolio:
    get:
      tags: [services]
      summary: Current posture of every non-archived service.
      operationId: getPortfolio
      responses:
        "200": { description: Portfolio., content: { application/json: { schema: { $ref: "#/components/schemas/Portfolio" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/portfolio/history:
    get:
      tags: [services]
      summary: Recent pipelines of every service and the portfolio over the last week.
      description: "For sparklines and deltas, loaded after the portfolio. Each service lists the state of its dashboard ref after each of its latest 20 pipelines; days gives the state of the whole portfolio 7, 6, ... and 1 day ago. A state is the sum over every artifact and kind of its latest scan at that moment, the rule the portfolio counts follow, so the last point of a service equals its portfolio counts. The answer is computed at most once every 30 seconds and may be that far behind the latest upload; when nothing changed it is reused for up to 2 minutes. generated_at says when it was computed."
      operationId: getPortfolioHistory
      responses:
        "200": { description: Portfolio history., content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioHistory" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services:
    get:
      tags: [services]
      operationId: listServices
      parameters:
        - { name: q, in: query, description: Substring of name or project path., schema: { type: string, maxLength: 200 } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: One page of services ordered by id., content: { application/json: { schema: { $ref: "#/components/schemas/ServicePage" } } } }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [services]
      summary: Add a service by GitLab project path (admin only).
      operationId: createService
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ServiceCreate" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "400": { description: Invalid request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The project path or SonarQube key is already used (code conflict)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}:
    get:
      tags: [services]
      operationId: getService
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Service., content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
    patch:
      tags: [services]
      summary: "Rename, link a SonarQube project key, choose the dashboard branch, or archive (admin only)."
      operationId: updateService
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ServiceUpdate" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "400": { description: Invalid request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The SonarQube key is already linked to another service (code conflict)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
    delete:
      tags: [services]
      summary: Delete a service and all its data (admin only).
      operationId: deleteService
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}/overview:
    get:
      tags: [services]
      summary: Current Trivy posture of a service for one ref.
      operationId: getServiceOverview
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ref, in: query, description: "Git ref. Defaults to the dashboard branch an administrator chose for the service, else the ref with the most recent scan.", schema: { type: string } }
      responses:
        "200": { description: Overview., content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}/scans:
    get:
      tags: [scans]
      summary: Scans of a service, newest first.
      operationId: listServiceScans
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ref, in: query, description: "Git ref. Defaults to the dashboard branch an administrator chose for the service, else the ref with the most recent scan.", schema: { type: string } }
        - { name: before, in: query, description: "Return the scans that come after the scan with this id in newest-first order (by scan time, then id); use next_before from the previous page.", schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: One page of scans., content: { application/json: { schema: { $ref: "#/components/schemas/ScanPage" } } } }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/scans/{id}:
    get:
      tags: [scans]
      operationId: getScan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Scan., content: { application/json: { schema: { $ref: "#/components/schemas/Scan" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/scans/{id}/diff:
    get:
      tags: [scans]
      summary: Findings new and fixed since the previous scan of the same service, ref, artifact and kind, or since an earlier scan chosen with base.
      operationId: getScanDiff
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: base, in: query, description: "Compare with this scan instead of the previous one: any earlier scan of the same service, artifact and kind, on any ref (see listEarlierScans).", schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: Diff., content: { application/json: { schema: { $ref: "#/components/schemas/ScanDiff" } } } }
        "400": { description: "The base is not an earlier scan of the same service, artifact and kind (code invalid_parameter).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/scans/{id}/earlier:
    get:
      tags: [scans]
      summary: Earlier scans of the same service, artifact and kind, newest first; the scans a diff can use as its base.
      operationId: listEarlierScans
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ref, in: query, description: "Only scans of this ref. Every ref when absent.", schema: { type: string } }
        - { name: before, in: query, description: "Return the scans that come after the scan with this id in newest-first order (by scan time, then id); use next_before from the previous page.", schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: One page of scans., content: { application/json: { schema: { $ref: "#/components/schemas/ScanPage" } } } }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}/vulnerabilities:
    get:
      tags: [findings]
      summary: Vulnerabilities in the current state (latest scan per artifact) of a ref.
      operationId: listServiceVulnerabilities
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ref, in: query, description: "Git ref. Defaults to the dashboard branch an administrator chose for the service, else the ref with the most recent scan.", schema: { type: string } }
        - { name: severity, in: query, description: Comma-separated list., schema: { type: string, example: "CRITICAL,HIGH" } }
        - { name: fixable, in: query, schema: { type: boolean } }
        - { name: suppressed, in: query, description: Include suppressed findings., schema: { type: boolean, default: false } }
        - { name: q, in: query, description: "Substring of package name, vulnerability ID or title.", schema: { type: string, maxLength: 200 } }
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: One page ordered by id., content: { application/json: { schema: { $ref: "#/components/schemas/VulnerabilityPage" } } } }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}/secrets:
    get:
      tags: [findings]
      summary: Secret findings in the current state of a ref. Matched values are never stored or returned.
      operationId: listServiceSecrets
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ref, in: query, description: "Git ref. Defaults to the dashboard branch an administrator chose for the service, else the ref with the most recent scan.", schema: { type: string } }
      responses:
        "200": { description: Secret findings., content: { application/json: { schema: { $ref: "#/components/schemas/SecretFindingList" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}/trends:
    get:
      tags: [services]
      summary: Severity counts per scan over time, with what each scan changed.
      operationId: getServiceTrends
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ref, in: query, description: "Git ref. Defaults to the dashboard branch an administrator chose for the service, else the ref with the most recent scan.", schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 90 } }
        - { name: all_refs, in: query, description: "Return the scans of every ref in the window, not only those of ref. ref and ref_source in the response still name the ref the dashboards show. The 300 scans listed at most are counted over every ref together.", schema: { type: boolean, default: false } }
      responses:
        "200": { description: "Trend points, oldest first: the newest 300 scans of the window at most.", content: { application/json: { schema: { $ref: "#/components/schemas/Trends" } } } }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/services/{id}/sonar:
    get:
      tags: [sonarqube]
      summary: Latest SonarQube analysis of a service and its history.
      operationId: getServiceSonar
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, description: Number of history entries., schema: { type: integer, minimum: 1, maximum: 200, default: 30 } }
      responses:
        "200": { description: SonarQube data; latest is null when nothing was analysed yet., content: { application/json: { schema: { $ref: "#/components/schemas/ServiceSonar" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/search/vulnerabilities:
    get:
      tags: [findings]
      summary: Every service and artifact whose current state contains a vulnerability ID, by default on the dashboard branch of each service and on protected refs.
      operationId: searchVulnerabilities
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 100, example: CVE-2024-3094 } }
        - name: scope
          in: query
          description: "Which refs are searched. dashboard (the default): for each service the ref its dashboards show (the branch an administrator chose, else the ref with the most recent scan) and every protected ref, that is every ref whose latest scan of an artifact was protected. all: every ref of every service, which reads far more data and is slower."
          schema: { type: string, enum: [dashboard, all], default: dashboard }
      responses:
        "200": { description: Matches., content: { application/json: { schema: { $ref: "#/components/schemas/VulnerabilitySearch" } } } }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/admin/audit:
    get:
      tags: [admin]
      summary: Audit log, newest first (admin only).
      operationId: listAuditEvents
      parameters:
        - { name: action, in: query, description: "Exact action, for example login.failed.", schema: { type: string, maxLength: 100 } }
        - { name: actor, in: query, description: "Substring of the actor, case-insensitive.", schema: { type: string, maxLength: 200 } }
        - { name: before, in: query, description: Return events with an id lower than this value., schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { description: Invalid parameter., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/admin/integrations/trivy:
    get:
      tags: [admin]
      summary: Health of scan ingestion (admin only).
      operationId: getTrivyIntegration
      responses:
        "200": { description: Status., content: { application/json: { schema: { $ref: "#/components/schemas/TrivyIntegration" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/admin/integrations/sonarqube:
    get:
      tags: [admin]
      summary: Health of the SonarQube integration (admin only).
      operationId: getSonarIntegration
      responses:
        "200": { description: Status., content: { application/json: { schema: { $ref: "#/components/schemas/SonarIntegration" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/admin/backups:
    get:
      tags: [backups]
      summary: List the backups, the current or last job, the backup schedule's last run and the folder (admin only).
      description: |
        The files in the backup folder are the source of truth: the list is
        read from the folder, newest first. A file whose manifest cannot be
        read is listed with `readable` false so it can be deleted; one made by
        a newer version of Scanopsis has `newer_version` true. When the
        folder cannot be used, `folder.ok` is false and `folder.error` says
        why and how to fix it. Whether the folder can be written is checked
        again at most every few seconds, so a folder that stops being
        writable while the server runs shows here too; a folder that cannot
        be read gives an empty list.
      operationId: listBackups
      responses:
        "200": { description: Backups and status., content: { application/json: { schema: { $ref: "#/components/schemas/BackupList" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
    post:
      tags: [backups]
      summary: Start a manual backup (admin only).
      description: |
        The backup runs in the background; follow it with `job` in the list.
        Audited as backup.created when it is written, or backup.failed.
      operationId: createBackup
      responses:
        "202": { description: The backup started., content: { application/json: { schema: { $ref: "#/components/schemas/JobStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: A backup or restore is already running (code busy)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "The backup folder cannot be used (code folder_unavailable; the message says why and how to fix it), the server is busy (code busy) or a backup is being restored (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "507": { description: "The backup folder has too little free space for a backup of the database and 512 MiB to spare (code no_space; the message gives both numbers).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/admin/backups/{name}:
    delete:
      tags: [backups]
      summary: Delete a backup (admin only).
      description: Audited as backup.deleted with the name and size.
      operationId: deleteBackup
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No backup with this name (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The backup is being restored (code in_use)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
  /api/v1/admin/backups/{name}/download:
    get:
      tags: [backups]
      summary: Download a backup file (admin only).
      description: |
        Sends the file as `application/gzip` with `Content-Disposition:
        attachment`, `Content-Length` and range support: a `Range` request
        resumes an interrupted download (206). The download may take as long
        as the client keeps reading; it is cut off only after 60 seconds
        without progress. Not counted by the concurrency limit. Every GET
        that sends content (200 or 206) is audited as backup.downloaded with
        the name, the size and the first and last byte sent (for several
        ranges, the span and their number); HEAD, 304 and 416 are not.
      operationId: downloadBackup
      parameters:
        - $ref: "#/components/parameters/BackupName"
        - { name: Range, in: header, required: false, description: "A byte range, for example bytes=1048576- to resume.", schema: { type: string } }
      responses:
        "200": { description: The whole file., content: { application/gzip: { schema: { type: string, format: binary } } } }
        "206": { description: The requested range., content: { application/gzip: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No backup with this name (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "416": { description: The range is outside the file. }
        "503": { $ref: "#/components/responses/Restoring" }
  /api/v1/admin/backups/{name}/preview:
    get:
      tags: [backups]
      summary: Check a backup in full and tell what restoring it would do (admin only).
      description: |
        Reads the whole file and checks its checksums and signature, as a
        restore does before it changes anything. That takes long for a large
        backup, so it runs in the background, one check at a time: the answer
        is `202` with the state `checking` until the preview is ready, then
        `200` with the preview. Ask again every few seconds. The preview is
        kept for an hour while the file and the retention period stay the
        same. A backup made by a newer version or with another secret key is
        described from its manifest with `schema_ok` or `key_matches` false.
        `scans_removed_by_retention` is how many of the backup's scans the
        next data clean-up deletes under the retention period the restored
        installation will have.
      operationId: previewRestore
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "200": { description: The preview., content: { application/json: { schema: { $ref: "#/components/schemas/RestorePreview" } } } }
        "202": { description: The backup is being checked; ask again., content: { application/json: { schema: { $ref: "#/components/schemas/BackupCheck" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No backup with this name (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "The file is damaged, not a Scanopsis backup, of an unknown format or not signed by this installation's key (code invalid_backup; the message says why).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "The server is busy (code busy), shutting down (code unavailable) or restoring a backup (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/admin/backups/{name}/restore:
    post:
      tags: [backups]
      summary: Replace all data with a backup (admin only).
      description: |
        Needs the phrase RESTORE and a current two-factor code of the
        administrator. The restore runs in the background: it checks the whole
        file, then, unless `skip_safety_backup` is true, takes a backup of the
        current data (kind before-restore), then replaces the data in one
        database transaction; while it replaces
        the data, the API answers 503 with the code restoring. Every session
        ends, this one too. The backup schedule and keep-days of this server
        are kept. Follow it with GET /api/v1/restore/status. Everything that
        can refuse the restore (a running job, the backup, the phrase) is
        checked before the two-factor code, so a refused restore does not use
        up a code. Restore mode starts once the whole file was checked, when
        the data is replaced.
      operationId: restoreBackup
      parameters:
        - $ref: "#/components/parameters/BackupName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "202": { description: The restore started., content: { application/json: { schema: { $ref: "#/components/schemas/JobStatus" } } } }
        "400": { description: Malformed body (code invalid_request)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "No valid session, or too many wrong two-factor codes ended it (code unauthenticated); sign in again.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No backup with this name (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "A job is running (code busy), or the backup was made with another secret key (code key_mismatch) or by a newer version (code newer_schema); the message says what to do.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "confirm is not RESTORE (code confirmation_required), the two-factor code is missing, wrong or used (code invalid_code), or the file cannot be read as a backup (code invalid_backup).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many code attempts (code too_many_attempts). Retry-After gives seconds., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "The server is busy (code busy), restoring a backup (code restoring), or waits for a restart after a restore or shuts down (code unavailable).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/admin/backups/schedule-status/dismiss:
    post:
      tags: [backups]
      summary: Dismiss the failure of the last scheduled backup (admin only).
      description: |
        Hides the banner about a failed scheduled backup: the list then shows
        `schedule.dismissed` true. The next scheduled run replaces the status,
        so a new failure shows again. Audited as
        backup.schedule_alert_dismissed with the time and the error of the
        failed run; nothing happens, and nothing is audited, when there is no
        failure to dismiss.
      operationId: dismissBackupScheduleAlert
      responses:
        "204": { description: "Dismissed, or nothing to dismiss." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
  /api/v1/admin/backup-uploads:
    post:
      tags: [backups]
      summary: Start uploading a backup file (admin only).
      description: |
        Send the file in parts with PUT, then complete the upload. At most two
        uploads may be open at once; one without a part for an hour is
        dropped. When two are open, a new upload takes the place of the one
        that has gone longest without a part, if that is more than 10
        minutes. The file must fit the free space of the backup folder less
        512 MiB and less what other open uploads still need.
      operationId: startBackupUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadStart" }
      responses:
        "201": { description: The upload is open., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "400": { description: Invalid file name or size (code invalid_request)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Two uploads are open already and none can make room yet (code too_many_uploads); the message says when one can: an upload that receives nothing for 10 minutes makes room, one being checked when its check has finished.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "The backup folder cannot be used (code folder_unavailable), the server is busy (code busy) or a backup is being restored (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "507": { description: Not enough free space (code no_space; the message gives the numbers)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/admin/backup-uploads/{id}:
    get:
      tags: [backups]
      summary: How much of an upload the server has, or the outcome of its check (admin only).
      description: |
        After a dropped connection, ask this and send the next part from
        `received`. After the upload was completed, `state` is `checking`
        until the check ends, then `ready` with `backup` or `refused` with
        `reason`; the outcome can be asked for up to a day after the check.
      operationId: getBackupUpload
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200": { description: The upload., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No upload with this id is open or was checked in the last day (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
    put:
      tags: [backups]
      summary: Send one part of an upload (admin only).
      description: |
        The body is the raw bytes of the file from `offset`, at most
        `chunk_size` (8 MiB) of them. `offset` must equal `received`. A part
        may take up to 5 minutes to arrive. A part that fails (a dropped
        connection, a timeout) is not kept: send it again from the same
        offset. Not counted by the general concurrency limit: at most 4 parts
        are received at once, 2 from one client address.
      operationId: putBackupUploadChunk
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadOffset"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: The part was stored., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "400": { description: "Invalid offset, a part past the size given at the start, or a part that was cut off (code invalid_request).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No upload with this id is open (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "408": { description: The part did not arrive within 5 minutes (code request_timeout)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "offset is not where the received data ends (code offset_mismatch; `received` gives it), or another part is still being received or the file is being checked (code upload_busy).", content: { application/json: { schema: { $ref: "#/components/schemas/UploadError" } } } }
        "413": { description: The part is larger than chunk_size (code payload_too_large)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Too many parts are being received (code busy; Retry-After gives seconds) or a backup is being restored (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "507": { description: The backup folder is full (code no_space)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [backups]
      summary: Cancel an upload and delete what was received (admin only).
      description: A check in progress is stopped and the file deleted.
      operationId: cancelBackupUpload
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No upload with this id is open (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: A part is still being received (code upload_busy); try again in a moment., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
  /api/v1/admin/backup-uploads/{id}/complete:
    post:
      tags: [backups]
      summary: Check a fully received upload and add it to the backups (admin only).
      description: |
        Starts the check of the whole file (manifest, checksums and
        signature) in the background, one check at a time, and answers `202`
        with the state `checking`; reading a large file takes longer than a
        proxy waits for an answer. Ask GET /api/v1/admin/backup-uploads/{id}
        every few seconds for the outcome. A file that passes joins the list
        as a backup of kind uploaded, with its original name (state `ready`,
        `backup` describes it); audited as backup.uploaded. A file that fails
        is deleted (state `refused`, `reason` gives the code, such as
        invalid_backup, key_mismatch or newer_schema, and a message that
        says why). Completing again answers `202` while the check runs and
        `200` with the outcome after it. The body may be empty.
      operationId: completeBackupUpload
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200": { description: The check has ended; `state` is ready or refused., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "202": { description: The file is being checked., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No upload with this id is open or was checked in the last day (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Not all of the file was received (code upload_incomplete; `received` gives how much), or a part is still being received (code upload_busy).", content: { application/json: { schema: { $ref: "#/components/schemas/UploadError" } } } }
        "503": { description: "The backup folder cannot be used (code folder_unavailable), the server is busy (code busy), shutting down (code unavailable) or restoring a backup (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/setup/restore/uploads:
    post:
      tags: [setup]
      summary: Start uploading a backup on the setup screen of a new installation.
      description: |
        Only while no administrator exists, with the setup token; otherwise
        409 setup_done. Works as POST /api/v1/admin/backup-uploads; the
        uploads of the setup screen are separate from those of the admin
        panel.
      operationId: startSetupRestoreUpload
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupUploadStart" }
      responses:
        "201": { description: The upload is open., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "400": { description: Invalid request (code invalid_request)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "409": { description: "Setup is complete (code setup_done), or two uploads are open already and none can make room yet (code too_many_uploads); the message says when one can: an upload that receives nothing for 10 minutes makes room, one being checked when its check has finished.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { description: "The backup folder cannot be used (code folder_unavailable), the server is busy (code busy) or a backup is being restored (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "507": { description: Not enough free space (code no_space)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/setup/restore/uploads/{id}:
    get:
      tags: [setup]
      summary: How much of a setup upload the server has, or the outcome of its check.
      description: |
        Works as GET /api/v1/admin/backup-uploads/{id}; a `ready` upload
        carries `preview`, the preview of the restore, and `backup`. The
        setup token goes in the X-Setup-Token header.
      operationId: getSetupRestoreUpload
      security: []
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/SetupToken"
      responses:
        "200": { description: The upload., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "404": { description: No upload with this id is open or was checked in the last day (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Setup is complete (code setup_done)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
    put:
      tags: [setup]
      summary: Send one part of a setup upload.
      description: Works as PUT /api/v1/admin/backup-uploads/{id}; the setup token goes in the X-Setup-Token header.
      operationId: putSetupRestoreUploadChunk
      security: []
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadOffset"
        - $ref: "#/components/parameters/SetupToken"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: The part was stored., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "400": { description: "Invalid offset, a part past the size given at the start, or a part that was cut off (code invalid_request).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "404": { description: No upload with this id is open (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "408": { description: The part did not arrive within 5 minutes (code request_timeout)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Setup is complete (code setup_done), offset is not where the received data ends (code offset_mismatch; `received` gives it), or another part is still being received or the file is being checked (code upload_busy).", content: { application/json: { schema: { $ref: "#/components/schemas/UploadError" } } } }
        "413": { description: The part is larger than chunk_size (code payload_too_large)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { description: "Too many parts are being received (code busy; Retry-After gives seconds) or a backup is being restored (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "507": { description: The backup folder is full (code no_space)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [setup]
      summary: Cancel a setup upload and delete what was received.
      description: A check in progress is stopped and the file deleted. The setup token goes in the X-Setup-Token header.
      operationId: cancelSetupRestoreUpload
      security: []
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/SetupToken"
      responses:
        "204": { description: Cancelled. }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "404": { description: No upload with this id is open (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Setup is complete (code setup_done), or a part is still being received (code upload_busy); try again in a moment.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
  /api/v1/setup/restore/uploads/{id}/complete:
    post:
      tags: [setup]
      summary: Check a fully received setup upload and tell what restoring it would do.
      description: |
        Works as POST /api/v1/admin/backup-uploads/{id}/complete: the check
        runs in the background and GET /api/v1/setup/restore/uploads/{id}
        gives the outcome. A file that passes is added to the backup folder
        as kind uploaded, and the outcome carries the preview of the restore
        in `preview`. Use the upload id to restore it. The setup token goes
        in the body or in the X-Setup-Token header; with the header the body
        may be empty.
      operationId: completeSetupRestoreUpload
      security: []
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - { name: X-Setup-Token, in: header, required: false, description: "The one-time setup token, when the body does not carry it.", schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupTokenBody" }
      responses:
        "200": { description: The check has ended; `state` is ready or refused., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "202": { description: The file is being checked., content: { application/json: { schema: { $ref: "#/components/schemas/UploadStatus" } } } }
        "400": { description: Malformed body (code invalid_request)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "404": { description: No upload with this id is open or was checked in the last day (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Setup is complete (code setup_done), not all of the file was received (code upload_incomplete; `received` gives how much), or a part is still being received (code upload_busy).", content: { application/json: { schema: { $ref: "#/components/schemas/UploadError" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { description: "The backup folder cannot be used (code folder_unavailable), the server is busy (code busy), shutting down (code unavailable) or restoring a backup (code restoring).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/setup/restore/token:
    post:
      tags: [setup]
      summary: Check the setup token before a backup is uploaded.
      description: |
        Only while no administrator exists. Answers 204 when the token is
        right, so the setup screen can say so before a large file is sent. A
        wrong token counts as an attempt of the per-address limit, as on every
        setup route.
      operationId: checkSetupRestoreToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupTokenCheck" }
      responses:
        "204": { description: The token is right. }
        "400": { description: Malformed body (code invalid_request)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "409": { description: Setup is complete (code setup_done)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
  /api/v1/setup/restore:
    post:
      tags: [setup]
      summary: Restore an uploaded backup into a new installation.
      description: |
        Only while no administrator exists, with the setup token and the
        phrase RESTORE. No backup of the empty database is taken first, and
        the backup's own schedule settings are kept. The restore runs in the
        background; follow it with GET /api/v1/restore/status. Afterwards the
        administrators of the backup sign in, and the setup endpoints answer
        409 setup_done.
      operationId: restoreSetupBackup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRestoreRequest" }
      responses:
        "202": { description: The restore started., content: { application/json: { schema: { $ref: "#/components/schemas/RestoreStatus" } } } }
        "400": { description: Malformed body (code invalid_request)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "404": { description: No completed upload with this id (code not_found)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Setup is complete (code setup_done), a job is running (code busy), or the backup was made with another secret key (code key_mismatch) or by a newer version (code newer_schema).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: confirm is not RESTORE (code confirmation_required)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "503": { $ref: "#/components/responses/BusyOrRestoring" }
  /api/v1/restore/status:
    get:
      tags: [backups]
      summary: State of the current or last restore. Answers during a restore.
      description: |
        Public, so the web interface can show progress while every other API
        request is answered 503 restoring. It names no backup, account or
        folder. The state is idle when the last job was not a restore. After a
        restore that needs a restart, the state is failed,
        `restart_required` is true and the message says to restart Scanopsis.
      operationId: getRestoreStatus
      security: []
      responses:
        "200": { description: The state., content: { application/json: { schema: { $ref: "#/components/schemas/RestoreStatus" } } } }
components:
  securitySchemes:
    ciIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: GitLab CI/CD ID token (id_tokens keyword) with the Scanopsis public URL as audience.
    session:
      type: apiKey
      in: cookie
      name: __Host-scanopsis_session
      description: Named scanopsis_session when the public URL uses plain HTTP.
  parameters:
    BackupName:
      name: name
      in: path
      required: true
      description: File name of a backup, as listed.
      schema: { type: string, pattern: '^scanopsis-backup-[0-9]{8}T[0-9]{6}Z-(manual|scheduled|uploaded|before-restore)-[a-z0-9]{6}\.tar\.gz$' }
    UploadID:
      name: id
      in: path
      required: true
      description: Id of an open upload.
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
    UploadOffset:
      name: offset
      in: query
      required: true
      description: Where the part starts in the file; must equal `received`.
      schema: { type: integer, format: int64, minimum: 0 }
    SetupToken:
      name: X-Setup-Token
      in: header
      required: true
      description: The one-time setup token from the server log.
      schema: { type: string }
  responses:
    BusyOrRestoring:
      description: "The server is busy (code busy) or a backup is being restored (code restoring). Nothing was done; retry after the number of seconds in Retry-After."
      headers:
        Retry-After: { description: Seconds to wait before retrying., schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Restoring:
      description: A backup is being restored (code restoring). Nothing was done; retry after the number of seconds in Retry-After.
      headers:
        Retry-After: { description: Seconds to wait before retrying., schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidSetupToken:
      description: Wrong setup token (code invalid_setup_token).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyAttempts:
      description: Too many wrong setup tokens from this address (code too_many_attempts). Retry-After gives seconds.
      headers:
        Retry-After: { description: Seconds to wait before retrying., schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Busy:
      description: The server is serving as many requests as it can and none became free within a few seconds (code busy). Nothing was done; retry after the number of seconds in Retry-After.
      headers:
        Retry-After: { description: Seconds to wait before retrying., schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: No valid session.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The signed-in user lacks the required role.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable machine-readable code., example: unauthenticated }
            message: { type: string, description: Human-readable explanation and next step. }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
        reason: { type: string }
    Version:
      type: object
      required: [version, commit, go]
      properties:
        version: { type: string }
        commit: { type: string }
        go: { type: string }
    AuthMethods:
      type: object
      required: [gitlab, local]
      properties:
        gitlab: { type: boolean }
        local: { type: boolean }
    LocalLoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    User:
      type: object
      required: [id, source, username, name, email, role, created_at, last_login_at, disabled_at, mfa_enrolled]
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [gitlab, local] }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        disabled_at: { type: [string, "null"], format: date-time, description: When an administrator disabled the user; null while the user may sign in. }
        mfa_enrolled: { type: boolean, description: The user has a confirmed TOTP enrolment. }
    UserPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_after:
          type: [integer, "null"]
          format: int64
          description: Pass as `after` to get the next page; null on the last page.
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean, description: true disables the user and ends their sessions; false enables the user. }
    Role:
      type: string
      enum: [admin, viewer]
    SeverityCounts:
      type: object
      required: [critical, high, medium, low, unknown]
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown: { type: integer }
    IngestResult:
      type: object
      required: [scan_id, service_id, service_created, replaced, counts, fixable, secrets, suppressed]
      properties:
        scan_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        service_created: { type: boolean }
        replaced: { type: boolean, description: "An earlier upload for the same job, artifact and kind was replaced." }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
        fixable: { type: integer }
        secrets: { type: integer }
        suppressed: { type: integer }
    Service:
      type: object
      required: [id, name, gitlab_project_id, gitlab_project_path, sonar_project_key, created_via, archived, created_at, default_ref]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        gitlab_project_id: { type: [integer, "null"], format: int64 }
        gitlab_project_path: { type: string }
        sonar_project_key: { type: [string, "null"] }
        created_via: { type: string, enum: [ingest, manual] }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        default_ref: { type: [string, "null"], description: "The branch (ref) an administrator chose for the dashboards of this service. null when none was chosen; the dashboards then show the ref with the most recent scan. The ref need not have scans yet." }
    ServicePage:
      type: object
      required: [items, next_after]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
        next_after: { type: [integer, "null"], format: int64 }
    ServiceCreate:
      type: object
      required: [gitlab_project_path]
      additionalProperties: false
      properties:
        gitlab_project_path: { type: string, minLength: 1, maxLength: 500, example: platform/payments-api }
        name: { type: string, maxLength: 200, description: Defaults to the last path segment. }
        sonar_project_key: { type: string, maxLength: 400 }
    ServiceUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sonar_project_key: { type: [string, "null"], maxLength: 400, description: null unlinks. }
        archived: { type: boolean }
        default_ref: { type: [string, "null"], minLength: 1, maxLength: 255, description: "Chooses the dashboard branch; null clears the choice. Trimmed; no control characters. It need not have scans yet." }
    ScanSummary:
      type: object
      required: [id, service_id, kind, artifact_name, gitlab_pipeline_id, gitlab_job_id, ref, ref_protected, commit_sha, trivy_version, scanned_at, received_at, counts, fixable, secrets, suppressed]
      properties:
        id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        kind: { type: string, enum: [image, secret-fs] }
        artifact_name: { type: string }
        gitlab_pipeline_id: { type: integer, format: int64 }
        gitlab_job_id: { type: integer, format: int64 }
        ref: { type: string }
        ref_protected: { type: boolean }
        commit_sha: { type: string }
        trivy_version: { type: string }
        scanned_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
        fixable: { type: integer }
        secrets: { type: integer }
        suppressed: { type: integer }
    Scan:
      allOf:
        - $ref: "#/components/schemas/ScanSummary"
        - type: object
          required: [gitlab_project_path, pipeline_url, job_url, commit_url]
          properties:
            gitlab_project_path: { type: string }
            pipeline_url: { type: [string, "null"], description: Link into GitLab; null when the GitLab URL is not configured. }
            job_url: { type: [string, "null"] }
            commit_url: { type: [string, "null"] }
    ScanPage:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScanSummary" } }
        next_before: { type: [integer, "null"], format: int64 }
    Vulnerability:
      type: object
      required: [id, scan_id, artifact_name, target, class, pkg_type, pkg_name, pkg_path, installed_version, fixed_version, vuln_id, severity, status, title, primary_url, suppressed, suppression, first_seen_at]
      properties:
        id: { type: integer, format: int64 }
        scan_id: { type: integer, format: int64 }
        artifact_name: { type: string }
        target: { type: string }
        class: { type: string, example: os-pkgs }
        pkg_type: { type: string }
        pkg_name: { type: string }
        pkg_path: { type: string }
        installed_version: { type: string }
        fixed_version: { type: string, description: Empty when no fix is available. }
        vuln_id: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { type: string }
        title: { type: string }
        primary_url: { type: string }
        suppressed: { type: boolean }
        suppression: { type: string, description: Reason recorded by Trivy for a suppressed finding. }
        first_seen_at: { type: string, format: date-time, description: "Scan time of the earliest scan of the same ref and artifact that contains this finding (vuln_id, pkg_name, target)." }
    VulnerabilityPage:
      type: object
      required: [items, next_after]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Vulnerability" } }
        next_after: { type: [integer, "null"], format: int64 }
    Severity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
    SecretFinding:
      type: object
      required: [id, scan_id, artifact_name, target, rule_id, category, severity, title, start_line, end_line, suppressed]
      properties:
        id: { type: integer, format: int64 }
        scan_id: { type: integer, format: int64 }
        artifact_name: { type: string }
        target: { type: string }
        rule_id: { type: string }
        category: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        title: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        suppressed: { type: boolean }
    SecretFindingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SecretFinding" } }
    PackageImpact:
      type: object
      description: "One installed package and what upgrading it clears. Risk points weigh each finding critical 10, high 5, medium 3, low 1, unknown 5 (the OWASP Dependency-Track weights)."
      required: [pkg_name, installed_version, fix_version, findings, by_severity, fixable, risk, risk_cleared]
      properties:
        pkg_name: { type: string }
        installed_version: { type: string }
        fix_version: { type: string, description: "Highest fixed version among the findings; upgrading to it clears the fixable ones. Empty when none is fixable." }
        findings: { type: integer }
        by_severity: { $ref: "#/components/schemas/SeverityCounts" }
        fixable: { type: integer, description: "Findings that report a fixed version." }
        risk: { type: integer, description: "Risk points of all the findings." }
        risk_cleared: { type: integer, description: "Risk points of the fixable findings, which the upgrade to fix_version clears." }
    RefSource:
      type: string
      enum: [requested, default, latest]
      description: "How the ref was chosen: requested (the ref parameter), default (the dashboard branch an administrator chose, even without scans yet) or latest (the ref with the most recent scan)."
    Overview:
      type: object
      required: [service, ref, ref_source, refs, artifacts, counts, fixable, secrets, suppressed, new_since_previous, fixed_since_previous, by_class, top_packages, data_at]
      properties:
        service: { $ref: "#/components/schemas/Service" }
        ref: { type: [string, "null"], description: "The ref shown. null when no ref was requested or chosen and the service has no scans yet." }
        ref_source: { $ref: "#/components/schemas/RefSource" }
        refs: { type: array, items: { type: string }, description: "Refs with scans, most recent first." }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ScanSummary" }, description: Latest scan per artifact and kind for the ref. }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
        fixable: { type: integer }
        secrets: { type: integer }
        suppressed: { type: integer }
        new_since_previous: { type: integer }
        fixed_since_previous: { type: integer }
        by_class:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SeverityCounts" }
          description: Counts per Trivy result class (os-pkgs, lang-pkgs).
        top_packages: { type: array, maxItems: 10, description: "Packages whose upgrade clears the most risk points first; then the most risk, the most findings and the most severe. Packages without a fix come last.", items: { $ref: "#/components/schemas/PackageImpact" } }
        data_at: { type: [string, "null"], format: date-time, description: Scan time of the newest scan in this overview. }
    ScanDiff:
      type: object
      required: [scan_id, previous_scan_id, base, new, fixed, unchanged_items, unchanged, new_total, fixed_total, truncated, new_counts, fixed_counts, unchanged_counts]
      properties:
        scan_id: { type: integer, format: int64 }
        previous_scan_id: { type: [integer, "null"], format: int64, description: "The scan compared with: the base asked for, else the previous scan of the same ref. null when there is none." }
        base: { oneOf: [ { $ref: "#/components/schemas/ScanSummary" }, { type: "null" } ], description: "The scan compared with, as in previous_scan_id." }
        new: { type: array, description: "At most 500 findings, the most severe first.", items: { $ref: "#/components/schemas/Vulnerability" } }
        fixed: { type: array, description: "At most 500 findings, the most severe first.", items: { $ref: "#/components/schemas/Vulnerability" } }
        unchanged_items: { type: array, description: "At most 100 findings present in both scans, the most severe first, as reported in this scan.", items: { $ref: "#/components/schemas/Vulnerability" } }
        unchanged: { type: integer }
        new_total: { type: integer, description: "Number of new findings, including any not listed in new."  }
        fixed_total: { type: integer, description: "Number of fixed findings, including any not listed in fixed."  }
        truncated: { type: boolean, description: "True when new, fixed or unchanged_items lists fewer findings than new_total, fixed_total or unchanged."  }
        new_counts: { $ref: "#/components/schemas/SeverityCounts", description: "Every new finding by severity, listed or not." }
        fixed_counts: { $ref: "#/components/schemas/SeverityCounts", description: "Every fixed finding by its severity in the base scan, listed or not." }
        unchanged_counts: { $ref: "#/components/schemas/SeverityCounts", description: "Every unchanged finding by its severity in this scan." }
    TrendPoint:
      type: object
      required: [scan_id, kind, ref, scanned_at, gitlab_pipeline_id, commit_sha, artifact_name, counts, fixable, previous_scan_id, new, fixed]
      properties:
        scan_id: { type: integer, format: int64 }
        kind: { type: string, enum: [image, secret-fs] }
        ref: { type: string }
        scanned_at: { type: string, format: date-time }
        gitlab_pipeline_id: { type: integer, format: int64 }
        commit_sha: { type: string }
        artifact_name: { type: string }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
        fixable: { type: integer }
        previous_scan_id: { type: [integer, "null"], format: int64, description: "The previous scan of the same ref, artifact and kind, which may be older than the window. null for a first scan." }
        new:
          $ref: "#/components/schemas/SeverityCounts"
          description: "Findings of this scan that the previous scan did not have, by severity, as new_total of the scan diff counts them. A first scan has every finding new; a secret scan has none."
        fixed: { type: integer, description: "Findings of the previous scan that this scan no longer has, as fixed_total of the scan diff counts them." }
    Trends:
      type: object
      required: [ref, ref_source, points, total, truncated]
      properties:
        ref: { type: [string, "null"] }
        ref_source: { $ref: "#/components/schemas/RefSource" }
        points: { type: array, maxItems: 300, description: "The newest 300 scans of the window at most, by scan time over every ref listed, oldest first.", items: { $ref: "#/components/schemas/TrendPoint" } }
        total: { type: integer, description: "Number of scans in the window, including any left out of points." }
        truncated: { type: boolean, description: "True when the oldest scans of the window were left out because more than 300 fall in it." }
    Rating:
      type: [string, "null"]
      enum: [A, B, C, D, E, null]
      description: null when SonarQube did not report the metric.
    SonarAnalysis:
      type: object
      required: [id, analysed_at, revision, quality_gate_status, conditions, reliability_rating, security_rating, maintainability_rating, security_review_rating, coverage, duplicated_lines_density, measures, mode, gitlab_pipeline_id, project_url]
      properties:
        id: { type: integer, format: int64 }
        analysed_at: { type: string, format: date-time }
        revision: { type: string }
        quality_gate_status: { type: string, enum: [OK, WARN, ERROR, NONE, ""] }
        conditions:
          type: array
          items:
            type: object
            required: [metric, operator, threshold, value, status]
            properties:
              metric: { type: string }
              operator: { type: string }
              threshold: { type: string }
              value: { type: [string, "null"] }
              status: { type: string }
        reliability_rating: { $ref: "#/components/schemas/Rating" }
        security_rating: { $ref: "#/components/schemas/Rating" }
        maintainability_rating: { $ref: "#/components/schemas/Rating" }
        security_review_rating: { $ref: "#/components/schemas/Rating" }
        coverage: { type: [number, "null"] }
        duplicated_lines_density: { type: [number, "null"] }
        measures:
          type: object
          additionalProperties: { type: string }
          description: Every measure as reported by SonarQube, by metric key.
        mode: { type: string, enum: [mqr, standard, ""] }
        gitlab_pipeline_id: { type: [integer, "null"], format: int64 }
        project_url: { type: [string, "null"], description: Link to the project in SonarQube. }
    ServiceSonar:
      type: object
      required: [sonar_project_key, latest, history]
      properties:
        sonar_project_key: { type: [string, "null"] }
        latest: { oneOf: [ { $ref: "#/components/schemas/SonarAnalysis" }, { type: "null" } ] }
        history: { type: array, items: { $ref: "#/components/schemas/SonarAnalysis" }, description: "Newest first, including latest." }
    PortfolioItem:
      type: object
      required: [service, ref, ref_source, counts, fixable, secrets, last_scan_at, quality_gate_status, reliability_rating, security_rating, maintainability_rating, coverage, last_analysis_at]
      properties:
        service: { $ref: "#/components/schemas/Service" }
        ref: { type: [string, "null"], description: "Ref the numbers come from: the dashboard branch when chosen, else the ref with the most recent scan." }
        ref_source: { type: string, enum: [default, latest], description: "default: the administrator's chosen dashboard branch; latest: the ref with the most recent scan." }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
        fixable: { type: integer }
        secrets: { type: integer }
        last_scan_at: { type: [string, "null"], format: date-time }
        quality_gate_status: { type: [string, "null"] }
        reliability_rating: { $ref: "#/components/schemas/Rating" }
        security_rating: { $ref: "#/components/schemas/Rating" }
        maintainability_rating: { $ref: "#/components/schemas/Rating" }
        coverage: { type: [number, "null"] }
        last_analysis_at: { type: [string, "null"], format: date-time }
    Portfolio:
      type: object
      required: [items, totals, generated_at]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PortfolioItem" } }
        totals:
          type: object
          required: [services, failing_quality_gates, services_with_critical, fixable]
          properties:
            services: { type: integer }
            failing_quality_gates: { type: integer }
            services_with_critical: { type: integer }
            fixable: { type: integer }
        generated_at: { type: string, format: date-time }
    PortfolioHistory:
      type: object
      required: [services, days, generated_at]
      properties:
        services:
          type: array
          description: "Every non-archived service with at least one scan on its dashboard ref, by id."
          items:
            type: object
            required: [service_id, ref, points]
            properties:
              service_id: { type: integer, format: int64 }
              ref: { type: string, description: "The dashboard ref, chosen as in the portfolio." }
              points:
                type: array
                maxItems: 20
                description: "The latest pipelines of the ref, oldest first."
                items:
                  type: object
                  required: [pipeline_id, at, counts]
                  properties:
                    pipeline_id: { type: integer, format: int64 }
                    at: { type: string, format: date-time, description: "Scan time of the pipeline's last scan." }
                    counts: { $ref: "#/components/schemas/SeverityCounts" }
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: "The state of the listed services together at 7, 6, ... and 1 times 24 hours before generated_at, oldest first."
          items:
            type: object
            required: [at, counts]
            properties:
              at: { type: string, format: date-time }
              counts: { $ref: "#/components/schemas/SeverityCounts" }
        generated_at: { type: string, format: date-time }
    VulnerabilitySearch:
      type: object
      required: [vuln_id, scope, items, truncated, total_findings, total_services, total_artifacts, counts, title, primary_url, fixed_versions]
      properties:
        vuln_id: { type: string }
        scope: { type: string, enum: [dashboard, all], description: "The scope that was searched, as asked for. The totals below count within it." }
        total_findings: { type: integer, format: int64, description: "Number of unsuppressed findings of this ID in the current scans of the scope, including any not listed in items." }
        total_services: { type: integer, format: int64, description: "Number of non-archived services with at least one such finding in the scope." }
        total_artifacts: { type: integer, format: int64, description: "Number of artifacts (per service) with at least one such finding in the scope." }
        counts: { $ref: "#/components/schemas/SeverityCounts", description: "Every matching finding by the severity reported for it, listed or not." }
        title: { type: string, description: "A title reported for the vulnerability, empty when none was. Over every match." }
        primary_url: { type: string, description: "An advisory URL reported for the vulnerability, empty when none was." }
        fixed_versions: { type: array, maxItems: 20, items: { type: string }, description: "Distinct fixed versions reported over every match, at most 20." }
        truncated: { type: boolean, description: "True when total_findings exceeds the 1000 findings listed. The listed ones are the most severe, then by service name." }
        items:
          type: array
          items:
            type: object
            required: [service, ref, artifact_name, scan_id, scanned_at, pkg_name, installed_version, fixed_version, severity]
            properties:
              service: { $ref: "#/components/schemas/Service" }
              ref: { type: string }
              artifact_name: { type: string }
              scan_id: { type: integer, format: int64 }
              scanned_at: { type: string, format: date-time }
              pkg_name: { type: string }
              installed_version: { type: string }
              fixed_version: { type: string }
              severity: { $ref: "#/components/schemas/Severity" }
    AuditEvent:
      type: object
      required: [id, at, actor, action, detail]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        detail: { type: object, additionalProperties: true, description: Event details as recorded; never contains secrets. }
    AuditPage:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_before: { type: [integer, "null"], format: int64 }
    TrivyIntegration:
      type: object
      required: [configured, last_upload_at, uploads_24h, rejections_24h, recent_rejections, daily]
      properties:
        configured: { type: boolean, description: "The GitLab URL is set, so ID tokens can be verified." }
        last_upload_at: { type: [string, "null"], format: date-time }
        uploads_24h: { type: integer }
        rejections_24h: { type: integer, description: Recorded rejections in the last 24 hours. Rate-limited requests are not recorded and the number of recorded rejections per client address is bounded for rejections before the namespace and protected-ref checks. }
        recent_rejections:
          type: array
          maxItems: 20
          items:
            type: object
            required: [at, reason, project_path, service_id, service_name]
            properties:
              at: { type: string, format: date-time }
              reason: { type: string }
              project_path: { type: [string, "null"] }
              service_id: { type: [integer, "null"], format: int64, description: The service registered for the project path; null when there is none. }
              service_name: { type: [string, "null"] }
        daily:
          type: array
          minItems: 30
          maxItems: 30
          description: Uploads and recorded rejections per UTC day over the last 30 days, oldest first, today last; days without either have zeros.
          items:
            type: object
            required: [day, uploads, rejections]
            properties:
              day: { type: string, format: date }
              uploads: { type: integer }
              rejections: { type: integer }
    SonarIntegration:
      type: object
      required: [configured, server_version, last_webhook_at, last_sync_at, last_sync_error, recent_deliveries]
      properties:
        configured: { type: boolean }
        server_version: { type: [string, "null"] }
        last_webhook_at: { type: [string, "null"], format: date-time }
        last_sync_at: { type: [string, "null"], format: date-time }
        last_sync_error: { type: [string, "null"] }
        recent_deliveries:
          type: array
          maxItems: 50
          items:
            type: object
            required: [task_id, project_key, received_at, outcome, service_id, service_name, detail]
            properties:
              task_id: { type: string }
              project_key: { type: string }
              received_at: { type: string, format: date-time }
              outcome: { type: string, enum: [pending, linked, unlinked, failed] }
              service_id: { type: [integer, "null"], format: int64 }
              service_name: { type: [string, "null"], description: Name of the linked service; null when the delivery is not linked. }
              detail: { type: string }
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [mfa_verified, must_change_password]
          properties:
            mfa_verified: { type: boolean, description: This session has passed the second factor. }
            must_change_password: { type: boolean }
    Session:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at, mfa_verified, client_ip, user_agent]
      properties:
        id: { type: integer, format: int64, description: Stable number of the session. }
        current: { type: boolean, description: This is the session making the request. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, description: "Last request, to the minute." }
        expires_at: { type: string, format: date-time, description: "Absolute expiry; the session ends earlier after the idle timeout." }
        mfa_verified: { type: boolean, description: The session has passed the second factor. }
        client_ip: { type: string, description: "Client address when the session started; empty if not recorded." }
        user_agent: { type: string, description: "First 200 bytes of the User-Agent header when the session started; empty if not recorded." }
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Session" }
    SessionsEnded:
      type: object
      required: [ended]
      properties:
        ended: { type: integer, format: int64, description: Number of sessions that ended. }
    SetupStatus:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
    SetupRequest:
      type: object
      required: [token, username, password]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 200 }
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    MFACode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 64, description: "A 6-digit TOTP code or a recovery code (xxxxx-xxxxx-xxxxx-xxxxx; codes of the older form xxxxx-xxxxx are still accepted until used). Case, spaces and hyphens do not matter." }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        otpauth_uri: { type: string, description: "otpauth://totp/... URI for a QR code." }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 12, maxLength: 1024 }
    Setting:
      type: object
      required: [key, type, secret, source, value, is_set, env_var, description]
      properties:
        key: { type: string, example: gitlab.allowed_groups }
        type: { type: string, enum: [string, url, boolean, duration, string_list, integer] }
        secret: { type: boolean }
        source: { type: string, enum: [default, env, ui] }
        value:
          description: Current value; always null for secrets.
          oneOf:
            - { type: "null" }
            - { type: string }
            - { type: boolean }
            - { type: integer }
            - { type: array, items: { type: string } }
        is_set: { type: boolean, description: "For secrets, whether a value exists." }
        env_var: { type: string, description: Environment variable that seeds this setting. }
        description: { type: string }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    SettingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Setting" }
    SettingUpdate:
      type: object
      additionalProperties:
        oneOf:
          - { type: "null" }
          - { type: string }
          - { type: boolean }
          - { type: integer }
          - { type: array, items: { type: string } }
    SettingsError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: { type: string, example: invalid_settings }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Problem per setting key.
    BackupKind:
      type: string
      enum: [manual, scheduled, uploaded, before-restore]
    BackupInfo:
      type: object
      required: [name, kind, size, created_at, created_by, app_version, schema, key_matches, readable, newer_version, uploaded_at, original_name]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/BackupKind" }
        size: { type: integer, format: int64, description: Bytes. }
        created_at: { type: string, format: date-time, description: When the data was backed up. }
        created_by: { type: string, description: "Who started the backup: an account (source:username), scheduler or setup." }
        app_version: { type: string, description: Version of Scanopsis that made the backup. }
        schema: { type: integer, format: int64, description: Database schema version of the backup. }
        key_matches: { type: boolean, description: The backup was made with the secret key this server runs with. Only such a backup can be restored. }
        readable: { type: boolean, description: "False when the manifest cannot be read: the backup can be deleted but not restored, and only name, kind, size and created_at are known." }
        newer_version: { type: boolean, description: "True when a newer version of Scanopsis made the backup (a newer file format or database schema): it cannot be restored by this version. A newer file format is also not readable." }
        uploaded_at: { type: [string, "null"], format: date-time, description: When an uploaded backup arrived. }
        original_name: { type: string, description: The file name an uploaded backup had; empty for other kinds. }
    JobProgress:
      type: object
      required: [table, tables_done, tables_total, bytes]
      properties:
        table: { type: string, description: Table being copied. }
        tables_done: { type: integer }
        tables_total: { type: integer }
        bytes: { type: integer, format: int64, description: Table data copied so far. }
    JobStatus:
      type: object
      description: The current or last backup or restore job. A finished job stays done or failed until the next one starts.
      required: [state, progress, percent, started_at, finished_at]
      properties:
        state: { type: string, enum: [idle, backing_up, restoring, done, failed] }
        type: { type: string, enum: [backup, restore], description: Absent while idle. }
        kind: { $ref: "#/components/schemas/BackupKind" }
        name: { type: string, description: "For a backup, the new file once written; for a restore, the backup being restored." }
        progress: { $ref: "#/components/schemas/JobProgress" }
        percent: { type: integer, minimum: 0, maximum: 100, description: "How far the job has come, counted in bytes: for a backup, the table data written against an estimate from the size of each table; for a restore, the file read by the check (the first 10%) and by the load. 100 only once the job is done." }
        message: { type: string, description: "What happens or went wrong, in a sentence." }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ScheduleStatus:
      type: object
      required: [last_run_at, ok, error, dismissed, enabled]
      properties:
        last_run_at: { type: [string, "null"], format: date-time, description: When the last scheduled backup ran; null before the first. }
        ok: { type: boolean }
        error: { type: string, description: Why the last scheduled backup failed; empty after a success. }
        dismissed: { type: boolean, description: An administrator dismissed the failure of the last scheduled backup; the next scheduled run sets it back to false. }
        enabled: { type: boolean, description: The backup schedule is on now. }
    BackupList:
      type: object
      required: [backups, job, schedule, disk, folder]
      properties:
        backups: { type: array, items: { $ref: "#/components/schemas/BackupInfo" }, description: Newest first. }
        job: { $ref: "#/components/schemas/JobStatus" }
        schedule: { $ref: "#/components/schemas/ScheduleStatus" }
        disk:
          type: object
          required: [free_bytes, used_bytes]
          properties:
            free_bytes: { type: integer, format: int64, description: Free space in the backup folder. }
            used_bytes: { type: integer, format: int64, description: Total size of the backups. }
        folder:
          type: object
          required: [path, ok]
          properties:
            path: { type: string }
            ok: { type: boolean }
            error: { type: string, description: Why the folder cannot be used and how to fix it. }
    RestorePreview:
      type: object
      required: [info, schema_ok, key_matches, scans_removed_by_retention, oldest_scan_at, retention_days]
      properties:
        info: { $ref: "#/components/schemas/BackupInfo" }
        schema_ok: { type: boolean, description: False when a newer version of Scanopsis made the backup. }
        key_matches: { type: boolean, description: False when another secret key made the backup. }
        scans_removed_by_retention: { type: integer, format: int64, description: Scans of the backup that the next data clean-up deletes. }
        oldest_scan_at: { type: [string, "null"], format: date-time }
        retention_days: { type: integer, description: The retention period the restored installation will have. }
    RestoreRequest:
      type: object
      required: [confirm, code]
      additionalProperties: false
      properties:
        confirm: { type: string, const: RESTORE }
        code: { type: string, description: A current TOTP code of the administrator. Recovery codes are not accepted. }
        skip_safety_backup: { type: boolean, default: false, description: Do not back up the current data first. }
    RestoreStatus:
      type: object
      required: [state, percent, message, finished_at, restart_required]
      properties:
        state: { type: string, enum: [idle, backing_up, restoring, done, failed] }
        percent: { type: integer, minimum: 0, maximum: 100, description: "How far the restore has come, counted in bytes of the file read (see JobStatus)." }
        message: { type: string, description: "What happens, in a sentence; names no backup or account." }
        finished_at: { type: [string, "null"], format: date-time }
        restart_required: { type: boolean, description: "True only when the restore replaced the data, or may have (PostgreSQL did not confirm the commit), and Scanopsis must restart to finish it (state failed). The message says which. The API stays in restore mode until the restart." }
    UploadStart:
      type: object
      required: [file_name, size]
      additionalProperties: false
      properties:
        file_name: { type: string, minLength: 1, maxLength: 255, description: The name of the file being uploaded; kept as original_name. }
        size: { type: integer, format: int64, minimum: 1, description: Size of the whole file in bytes. }
    SetupUploadStart:
      type: object
      required: [token, file_name, size]
      additionalProperties: false
      properties:
        token: { type: string, description: The one-time setup token from the server log. }
        file_name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1 }
    SetupTokenBody:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The one-time setup token from the server log. }
    SetupTokenCheck:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The one-time setup token from the server log. }
    SetupRestoreRequest:
      type: object
      required: [token, upload_id, confirm]
      additionalProperties: false
      properties:
        token: { type: string, description: The one-time setup token from the server log. }
        upload_id: { type: string, description: Id of a completed setup upload. }
        confirm: { type: string, const: RESTORE }
    UploadStatus:
      type: object
      required: [id, file_name, size, chunk_size, received, state]
      properties:
        id: { type: string, description: 128-bit random id in hex. }
        file_name: { type: string }
        size: { type: integer, format: int64 }
        chunk_size: { type: integer, description: The largest part the server takes (8 MiB). }
        received: { type: integer, format: int64, description: Bytes stored so far; the next part starts here. }
        state:
          type: string
          enum: [uploading, checking, ready, refused]
          description: "uploading while parts are sent; checking once the upload was completed, while the server checks the file; ready when it passed and was added to the backups; refused when it failed and was deleted."
        reason:
          type: object
          description: Why a refused upload failed, with the code and message an error answer would carry (for example invalid_backup, key_mismatch, newer_schema, no_space).
          required: [code, message]
          properties:
            code: { type: string, example: invalid_backup }
            message: { type: string }
        backup: { $ref: "#/components/schemas/BackupInfo", description: The backup a ready upload became. }
        preview: { $ref: "#/components/schemas/RestorePreview", description: "On the setup screen, the preview of restoring a ready upload." }
    BackupCheck:
      type: object
      required: [state]
      properties:
        state: { type: string, const: checking, description: The backup is being checked; ask again. }
    UploadError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: offset_mismatch }
            message: { type: string }
            received: { type: integer, format: int64, description: "For offset_mismatch and upload_incomplete, the bytes the server has." }
security:
  - session: []
